# Trigger Cloudflare Pages Deploy Hook when Notion content changes.
#
# Required secret:
#   CLOUDFLARE_DEPLOY_HOOK  - Pages Deploy Hook URL (POST)
#
# Recommended for auto change-detection (GitHub IPs often blocked on unofficial Notion API):
#   NOTION_PAGE_ID
#   NOTION_INTEGRATION_TOKEN  - Notion Internal Integration secret (ntn_... / secret_...)
#
# Optional:
#   API_BASE_URL              - unofficial API fallback only

name: Notion change → Cloudflare deploy

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: notion-cf-deploy
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore previous fingerprint
        uses: actions/cache@v4
        with:
          path: .notion-deploy-fingerprint
          key: notion-fp-${{ github.run_id }}
          restore-keys: |
            notion-fp-

      - name: Detect changes and maybe deploy
        env:
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_INTEGRATION_TOKEN: ${{ secrets.NOTION_INTEGRATION_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          should_deploy=false
          reason=""

          # Manual "Run workflow" always deploys (Notion unofficial API is often blocked on GHA IPs)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_deploy=true
            reason="manual Run workflow"
          else
            PAGE_ID="${NOTION_PAGE_ID%%,*}"
            PAGE_ID="${PAGE_ID#*:}"
            PAGE_ID="$(echo "${PAGE_ID:-}" | tr -d '[:space:]')"

            NEW_FP=""

            # 1) Official Notion API (works from GitHub Actions when integration is shared)
            if [ -n "${NOTION_INTEGRATION_TOKEN:-}" ] && [ -n "$PAGE_ID" ]; then
              echo "Trying official Notion API..."
              HTTP_CODE=$(curl -sS -o /tmp/notion-official.json -w "%{http_code}" \
                -H "Authorization: Bearer ${NOTION_INTEGRATION_TOKEN}" \
                -H "Notion-Version: 2022-06-28" \
                "https://api.notion.com/v1/pages/${PAGE_ID}" || true)
              echo "Official API HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                NEW_FP=$(jq -r '"official|" + (.last_edited_time // .id // "unknown")' /tmp/notion-official.json)
              else
                echo "Official API body:"
                head -c 400 /tmp/notion-official.json || true
                echo
              fi
            else
              echo "Skip official API (need secrets NOTION_INTEGRATION_TOKEN + NOTION_PAGE_ID)."
            fi

            # 2) Unofficial loadPageChunk fallback (often blocked on GitHub runners)
            if [ -z "$NEW_FP" ] && [ -n "$PAGE_ID" ]; then
              UUID=$(echo "$PAGE_ID" | sed -E 's/^(.{8})(.{4})(.{4})(.{4})(.{12})$/\1-\2-\3-\4-\5/')
              BODY=$(jq -nc --arg id "$UUID" '{pageId:$id,limit:30,cursor:{stack:[]},chunkNumber:0,verticalColumns:false}')
              echo "$BODY" > /tmp/notion-body.json

              CANDIDATES=()
              if [ -n "${API_BASE_URL:-}" ]; then
                CANDIDATES+=("${API_BASE_URL%/}")
              fi
              CANDIDATES+=(
                "https://eminent-fountain-944.notion.site/api/v3"
                "https://www.notion.so/api/v3"
              )

              for BASE in "${CANDIDATES[@]}"; do
                echo "Trying unofficial API: $BASE/loadPageChunk"
                HTTP_CODE=$(curl -sS -o /tmp/notion-resp.json -w "%{http_code}" -X POST "$BASE/loadPageChunk" \
                  -H 'content-type: application/json' \
                  -H 'user-agent: NotionNext-CF-Deploy/1.0' \
                  --data-binary @/tmp/notion-body.json || true)
                echo "HTTP $HTTP_CODE"
                if [ "$HTTP_CODE" = "200" ]; then
                  NEW_FP=$(jq -r --arg id "$UUID" '
                    "unofficial|" +
                    (.recordMap.block[$id].value.value.version // .recordMap.block[$id].value.version // 0|tostring)
                    + "|" +
                    ((.recordMap.collection // {}) | to_entries | map(.value.value.last_edited_time // .value.last_edited_time // "") | max // "")
                  ' /tmp/notion-resp.json)
                  break
                fi
                head -c 200 /tmp/notion-resp.json || true
                echo
              done
            fi

            if [ -z "$NEW_FP" ]; then
              echo "::warning::Notion unreachable from GitHub Actions; skip scheduled deploy."
              echo "Fix: add NOTION_INTEGRATION_TOKEN + share the DB with the integration."
              echo "Or click Actions → Run workflow after publishing."
              exit 0
            fi

            OLD=""
            if [ -f .notion-deploy-fingerprint ]; then
              OLD=$(cat .notion-deploy-fingerprint)
            fi
            echo "old=$OLD"
            echo "new=$NEW_FP"
            echo "$NEW_FP" > .notion-deploy-fingerprint

            if [ "$OLD" = "$NEW_FP" ] && [ -n "$OLD" ]; then
              echo "No Notion change; skip deploy."
              exit 0
            fi
            should_deploy=true
            reason="Notion fingerprint changed"
          fi

          echo "Deploy reason: $reason"

          if [ -z "${CLOUDFLARE_DEPLOY_HOOK:-}" ]; then
            echo "::error::Secret CLOUDFLARE_DEPLOY_HOOK is missing."
            echo "Cloudflare Pages → Settings → Deploy hooks → create hook → paste URL into GitHub Secrets."
            exit 1
          fi

          if [ "$should_deploy" != "true" ]; then
            echo "Nothing to deploy."
            exit 0
          fi

          echo "Posting Deploy Hook..."
          HOOK_CODE=$(curl -sS -o /tmp/hook-resp.txt -w "%{http_code}" -X POST "$CLOUDFLARE_DEPLOY_HOOK" || true)
          echo "Deploy Hook HTTP $HOOK_CODE"
          cat /tmp/hook-resp.txt || true
          echo
          case "$HOOK_CODE" in
            200|201|202|204) echo "Deploy Hook triggered." ;;
            *)
              echo "::error::Deploy Hook failed (HTTP $HOOK_CODE). Recreate hook and update CLOUDFLARE_DEPLOY_HOOK secret."
              exit 1
              ;;
          esac
